services:

  # ============================================================
  # 1. MySQL Database
  # ============================================================

  db:
    image: mysql:8.0
    restart: always

    environment:
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql


  # ============================================================
  # 2. FastAPI Backend
  # ============================================================

  web:
    build:
      context: ./movies_semantic_plot
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - MYSQL_HOST=db

    volumes:
      - ./movies_semantic_plot:/app

    depends_on:
      - db


  # ============================================================
  # 3. Angular Frontend
  # ============================================================

  frontend:
    build:
      context: ./movies
      dockerfile: Dockerfile

    ports:
      - "4200:4200"

    volumes:
      - ./movies:/app
      - /app/node_modules

    depends_on:
      - web


  # ============================================================
  # 4. Create Chroma Vectorstore
  # Τρέχει μόνο όταν το καλέσουμε
  # ============================================================

  create_vectorstore:
    build:
      context: ./movies_semantic_plot
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      - MYSQL_HOST=db

    volumes:
      - ./movies_semantic_plot:/app

    entrypoint:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.scripts.create_vectorstore"
      ]

    profiles:
      - tools


  # ============================================================
  # 5. Import Movies
  # Τρέχει μόνο όταν το καλέσουμε
  # ============================================================

  import_movies:
    build:
      context: ./movies_semantic_plot
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      - MYSQL_HOST=db

    volumes:
      - ./movies_semantic_plot:/app

    entrypoint:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.scripts.import_movies"
      ]

    profiles:
      - tools


# ============================================================
# Persistent volumes
# ============================================================

volumes:
  mysql_data:

































